<style>
/* Layout: una columna tipo app, encabezado fijo con avance + filtros, lista de renglones grandes, barra inferior con 3 pestañas */
:root{
  --bg:#f2f4f7; --card:#ffffff; --fg:#172130; --muted:#5a6675; --line:#d9dfe7;
  --accent:#1f5fbf; --accent-soft:#e1ebf8; --on-accent:#ffffff;
  --warn:#a3520b; --warn-soft:#fbe9d5; --ok:#1d7a46; --ok-soft:#dcefe3;
  --crit:#b3261e; --crit-soft:#f9dedc; --field:#ffffff; --field-line:#1f5fbf;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --card:#18202a; --fg:#e6ebf2; --muted:#98a4b3; --line:#2a3441;
  --accent:#8ab8ff; --accent-soft:#1f2f47; --on-accent:#0b1420;
  --warn:#f0a35a; --warn-soft:#3a2a18; --ok:#6fd39c; --ok-soft:#1f3a2c;
  --crit:#ff8a80; --crit-soft:#451f1c; --field:#34404f; --field-line:#8ab8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --card:#18202a; --fg:#e6ebf2; --muted:#98a4b3; --line:#2a3441;
  --accent:#8ab8ff; --accent-soft:#1f2f47; --on-accent:#0b1420;
  --warn:#f0a35a; --warn-soft:#3a2a18; --ok:#6fd39c; --ok-soft:#1f3a2c;
  --crit:#ff8a80; --crit-soft:#451f1c; --field:#34404f; --field-line:#8ab8ff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;gap:7px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.prog b{color:var(--fg)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
input[type=search]{width:100%;font:inherit;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.84rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.toggles{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{width:18px;height:18px;accent-color:var(--accent)}
.info{flex:1;min-width:0}
.meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warn);color:var(--card)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav button{flex:1;max-width:240px;font:inherit;font-weight:700;font-size:.95rem;padding:14px 6px;border:none;background:none;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav button[aria-selected=true]{color:var(--accent);border-top-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{text-align:right;font-weight:700}
tr:last-child td{border-bottom:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{font:inherit;font-weight:700;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--warn)}
.note{font-size:.85rem;color:var(--muted);margin-top:10px}
.confirm{margin-top:10px;padding:12px;border-radius:12px;background:var(--warn-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addf{display:grid;gap:6px;margin-top:16px;padding:14px;background:var(--card);border:1px solid var(--accent);border-radius:14px}
.addf label{font-size:.85rem;font-weight:700;margin-top:6px}
.addf input,.addf select{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.addf #aErr,.err{color:var(--warn)}
.noname{color:var(--muted);font-style:italic}
.row.edit{border-color:var(--accent)}
.per,.addf input[type=date]{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
tr.grp td{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg);padding-block:6px}
.ex{margin-top:14px;padding:14px;border:1px dashed var(--line);border-radius:14px}
.btn:disabled{opacity:.5;cursor:default}
.hist{display:grid;gap:8px}
.hitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.hitem b{display:block;font-family:var(--display);font-size:1rem}
.hitem span{font-size:.82rem;color:var(--muted)}
.hitem i{font-style:normal;color:var(--accent);font-weight:700;flex:none}
.htitle{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:14px 0 2px}
.cat{font-family:var(--display);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 5px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.name{font-weight:700;font-size:.9rem;line-height:1.2;overflow-wrap:anywhere}
.tot{flex:none;width:68px;height:40px;padding:0 3px;display:grid;place-items:center;text-align:center;white-space:nowrap;overflow:hidden;border:none;border-radius:9px;font-family:var(--display);font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;background:none;color:var(--muted)}
button.tot{cursor:pointer}
.tot.ok{background:var(--ok-soft);color:var(--ok)}

.tot.l5{font-size:.95rem}
.tot.l7{font-size:.76rem;letter-spacing:-.02em}

.dot.on{background:var(--ok)}.dot.off{background:var(--warn)}

.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}

.ask{color:var(--fg);font-weight:700}
.lnk.danger{color:var(--crit)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.drop{display:grid;justify-items:center;gap:4px;margin:0;padding:26px 16px;text-align:center;font-size:1rem;font-weight:400;border:2px dashed var(--field-line);border-radius:12px;background:var(--accent-soft);color:var(--accent);cursor:pointer}

.drop.over{background:var(--field)}
.vh:focus-visible+.drop{outline:3px solid var(--accent);outline-offset:2px}
.tag.new{background:var(--accent);color:var(--on-accent)}
.lnk{font:inherit;font-size:.8rem;font-weight:700;background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}

</style>

function readFile(file){
  upErr='';const rd=new FileReader();
  rd.onload=e=>{try{
    if(typeof XLSX==='undefined')throw new Error('lib');
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
    if(rows.length<2)throw new Error('vacio');
    let hi=rows.findIndex(r=>r.filter(c=>typeof c==='string'&&c.trim()).length>=2);if(hi<0)hi=0;
    const head=rows[hi].map((h,i)=>String(h).trim()||'Columna '+(i+1));
    let p=guessCol(head,['producto','articulo','item','descripcion','nombre','bebida']);
    let q=guessCol(head,['cantidad','vendid','qty','unidades','piezas','cant']);
    if(p<0)p=0;if(q<0)q=Math.min(1,head.length-1);
    up={name:file.name,date:(up&&up.date)||today(),head,rows:rows.slice(hi+1),p,q};
  }catch(err){up=null;upErr=err.message==='lib'?'No se pudo cargar el lector de Excel. Revisa tu conexión y vuelve a intentar.':'No pude leer ese archivo. Sube un Excel (.xlsx, .xls) o CSV con una columna de producto y otra de cantidad.'}
  render()};
  rd.readAsArrayBuffer(file);
}
function parsedSales(){
  const m={};up.rows.forEach(r=>{const n=String(r[up.p]).trim();const q=parseFloat(String(r[up.q]).replace(/,/g,''));
    if(n&&!isNaN(q)&&q>0&&!/^total/i.test(norm(n)))m[n]=(m[n]||0)+q});
  return Object.entries(m);
}
function breakdown(sales,recipes){
  const rmap={};recipes.forEach(r=>rmap[norm(r.b)]=r);
  const imap={};items().forEach(it=>{if(it.n)imap[norm(it.n)]=it});
  const use={},missing=[];let sold=0;
  sales.forEach(([n,q])=>{sold+=q;const r=rmap[norm(n)];
    if(r)r.i.forEach(([id,a,u])=>{const k=id+'|'+u;use[k]=(use[k]||0)+a*q});
    else if(imap[norm(n)]){const k=imap[norm(n)].id+'|pza';use[k]=(use[k]||0)+q}
    else missing.push([n,q])});
  const byId={};items().forEach(it=>byId[it.id]=it);
  const rows=Object.entries(use).map(([k,v])=>{const[id,u]=k.split('|');const it=byId[+id];return{it,u,v}}).filter(r=>r.it)
    .sort((a,b)=>a.it.c-b.it.c||a.it.n.localeCompare(b.it.n));
  return{rows,missing:missing.sort((a,b)=>b[1]-a[1]),sold};
}
function salesFor(p){
  const days=Object.keys(st.sales).sort();
  const pick=p==='semana'?days.filter(d=>{const last=days[days.length-1];return (new Date(last)-new Date(d))/864e5<7}):[p];
  const m={};pick.forEach(d=>(st.sales[d]||[]).forEach(([n,q])=>m[n]=(m[n]||0)+q));
  return{sales:Object.entries(m),days:pick};
}
function bdHTML(b,note){
  let h=`<div class="sum"><div class="tile"><b>${fmtN(b.sold)}</b><span>productos vendidos</span></div>
  <div class="tile"><b>${b.rows.length}</b><span>insumos usados</span></div>
  <div class="tile"><b style="color:${b.missing.length?'var(--warn)':'var(--ok)'}">${b.missing.length}</b><span>sin receta</span></div></div>`;
  h+=note?`<p class="note">${note}</p>`:'';
  h+='<div class="cat">Consumo por insumo</div>';
  if(!b.rows.length)h+='<p class="note">Ningún producto vendido tiene receta todavía, por eso no hay consumo que mostrar.</p>';
  else{let last=-1;h+='<div class="tbl"><table><thead><tr><th>Insumo</th><th style="text-align:right">Usado</th></tr></thead><tbody>';
    b.rows.forEach(r=>{if(r.it.c!==last){last=r.it.c;h+=`<tr class="grp"><td colspan="2">${esc(DATA.cats[r.it.c])}</td></tr>`}
      h+=`<tr><td>${r.it.n?esc(r.it.n):'Sin nombre'}<div class="meta">${r.it.sap||'Sin código'}</div></td><td class="n">${fmtN(r.v)} ${r.u}</td></tr>`});
    h+='</tbody></table></div>'}
  if(b.missing.length)h+=`<div class="cat">Vendidos sin receta</div><p class="note">Estos productos no se descontaron de ningún insumo. Se arreglan al cargar sus recetas.</p>
    <div class="tbl"><table><tbody>${b.missing.map(([n,q])=>`<tr><td>${esc(n)}</td><td class="n">${fmtN(q)}</td></tr>`).join('')}</tbody></table></div>`;
  return h;
}
function consumo(){
  const days=Object.keys(st.sales).sort().reverse();
  let h='<div class="cat">Subir reporte del día</div>';
  if(!up){
    h+=`<div class="addf"><input class="vh" type="file" id="uFile" accept=".xlsx,.xls,.csv">
      <label class="drop" for="uFile" id="uDrop">${UPLOAD}<b>Subir reporte del día</b><span>Toca para elegir un Excel o CSV del POS o Drive Thru</span></label>
      ${upErr?`<p class="note err">${esc(upErr)}</p>`:''}
      <p class="note" style="margin:0">Debe traer una columna con el nombre del producto y otra con la cantidad vendida. Puedes subir el reporte del POS y luego el del Drive Thru del mismo día: se suman.</p></div>`;
  }else{
    const opts=sel=>up.head.map((x,i)=>`<option value="${i}"${i===sel?' selected':''}>${esc(x)}</option>`).join('');
    const ps=parsedSales();
    h+=`<div class="addf"><div class="meta">${esc(up.name)} · ${up.rows.length} renglones</div>
      <label for="uDate">Día del reporte</label><input type="date" id="uDate" value="${up.date}">
      <label for="uP">Columna del producto</label><select id="uP">${opts(up.p)}</select>
      <label for="uQ">Columna de cantidad</label><select id="uQ">${opts(up.q)}</select>
      <div class="cat" style="margin-top:8px">Vista previa (${ps.length} productos)</div>
      <div class="tbl" style="margin-top:0"><table><tbody>${ps.slice(0,6).map(([n,q])=>`<tr><td>${esc(n)}</td><td class="n">${fmtN(q)}</td></tr>`).join('')||'<tr><td>No encontré cantidades en esa columna. Prueba con otra.</td></tr>'}</tbody></table></div>
      <div class="actions" style="margin-top:6px"><button class="btn pri" id="uSave"${ps.length?'':' disabled'}>Guardar ${ps.length} productos del ${fmtDate(up.date)}</button><button class="btn" id="uCancel">Cancelar</button></div></div>`;
  }
  if(days.length){
    if(!period||(period!=='semana'&&!st.sales[period]))period=days[0];
    h+=`<div class="cat">Desglose</div><select id="per" class="per">${days.map(d=>`<option value="${d}"${d===period?' selected':''}>${fmtDate(d)}</option>`).join('')}<option value="semana"${period==='semana'?' selected':''}>Semana (7 días hasta ${fmtDate(days[0])})</option></select>`;
    const s=salesFor(period);
    h+=bdHTML(breakdown(s.sales,RECIPES),period==='semana'?`Suma de ${s.days.length} día${s.days.length>1?'s':''} con reporte.`:'');
    h+=`<div class="cat">Días guardados</div><div class="tbl"><table><tbody>${days.map(d=>`<tr><td>${fmtDate(d)}<div class="meta">${st.sales[d].length} productos</div></td><td class="n">${delDay===d?`¿Borrar? <button class="lnk" data-day="${d}" data-a="yes">Sí</button> <button class="lnk" data-a="no">No</button>`:`<button class="lnk" data-day="${d}" data-a="ask">Borrar</button>`}</td></tr>`).join('')}</tbody></table></div>`;
  }else{
    h+=`<p class="note">Cuando subas tu primer reporte, aquí verás cuánto se usó de cada insumo ese día y la suma de la semana.</p>`;
  }
  h+=`<div class="actions"><button class="btn" id="bEx">${showEx?'Ocultar ejemplo':'Ver un ejemplo'}</button></div>`;
  if(showEx)h+=`<div class="ex"><div class="cat" style="margin-top:0">Ejemplo con datos inventados</div>`+bdHTML(breakdown(EXAMPLE.sales,EXAMPLE.recipes),'Recetas y ventas de muestra, no son las tuyas. Así se verá un día real cuando estén cargadas tus recetas. La galleta se descuenta sola porque se vende tal cual; el té no tiene receta.')+'</div>';
  if(!RECIPES.length)h+=`<p class="note">Todavía no hay recetas cargadas: por ahora todo lo vendido aparecerá como "sin receta", salvo los productos que se venden tal cual (galletas, panes, aguas).</p>`;
  return h;
}
function bindConsumo(){
  const f=$('uFile');if(f)f.onchange=()=>f.files[0]&&readFile(f.files[0]);
  const dz=$('uDrop');if(dz){
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
    dz.ondragleave=()=>dz.classList.remove('over');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const x=e.dataTransfer.files[0];if(x)readFile(x)};
  }
  if(up){$('uDate').onchange=e=>{up.date=e.target.value||today();render()};
    $('uP').onchange=e=>{up.p=+e.target.value;render()};$('uQ').onchange=e=>{up.q=+e.target.value;render()};
    $('uCancel').onclick=()=>{up=null;render()};
    $('uSave').onclick=()=>{const q={};parsedSales().forEach(([n,v])=>q[n]=FV.increment(v));
      root.collection('ventas').doc(up.date).set({q},{merge:true}).catch(writeErr);period=up.date;up=null;render()}}
  const p=$('per');if(p)p.onchange=e=>{period=e.target.value;render()};
  $('bEx').onclick=()=>{showEx=!showEx;render()};
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='ask')delDay=b.dataset.day;else if(a==='no')delDay=null;else{root.collection('ventas').doc(b.dataset.day).delete().catch(writeErr);delDay=null}render()});
}
function csv(){
  const lines=['SAP,Producto,Categoria,Conteo,Minimo'];
  items().forEach(it=>lines.push([it.sap,'"'+it.n.replace(/"/g,'""')+'"','"'+DATA.cats[it.c]+'"',st.count[it.id]??'',st.min[it.id]??''].join(',')));
  return lines.join('\n');
}
const pdf=()=>makePdf(snapshot().rows,Date.now());
async function makePdf(rows,t){
  const m=$('pdfMsg');const say=t=>{m.textContent=t;m.hidden=false};
  if(!window.jspdf)return say('No se pudo cargar el generador de PDF. Revisa tu conexión y vuelve a intentar.');
  if(!rows.length)return say('Todavía no has contado ningún producto.');
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'letter'});
  const d=new Date(t),fecha=d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'});
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('Conteo de insumos',40,46);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(`${fecha} · ${rows.length} productos contados`,40,63);
  doc.autoTable({startY:76,head:[['SAP','NOMBRE','CANTIDAD']],body:rows.map(r=>[r.s,r.n,fmtN(r.q)]),
    styles:{font:'helvetica',fontSize:9.5,cellPadding:4},headStyles:{fillColor:[31,95,191],textColor:255},
    columnStyles:{0:{cellWidth:70},2:{cellWidth:80,halign:'right'}},margin:{left:40,right:40},
    didDrawPage:()=>{doc.setFontSize(8);doc.setTextColor(120);doc.text('Página '+doc.internal.getNumberOfPages(),doc.internal.pageSize.getWidth()-40,doc.internal.pageSize.getHeight()-20,{align:'right'});doc.setTextColor(0)}});
  const name=`conteo-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.pdf`;
  const dl=window.claude&&claude.use?await claude.use('downloads'):null;
  if(dl){try{await dl.save({filename:name,data:doc.output('blob')});say('Listo, PDF descargado.')}catch(e){if(e&&e.code!=='declined')say('No se pudo descargar el PDF aquí. Intenta otra vez.')}}
  else{try{doc.save(name);say('Listo, PDF descargado.')}catch(e){say('Este navegador no dejó descargar el PDF.')}}
}
function render(){
  const isList=view==='contar'||view==='minimos';
  ['q','chips','toggles'].forEach(id=>$(id).hidden=!isList);
  $('ttl').textContent={contar:'Conteo de insumos',minimos:'Catálogo y mínimos',consumo:'Consumo diario',resumen:'Resumen'}[view];
  progress();
  $('main').innerHTML=isList?list():view==='consumo'?consumo():resumen();
  if(isList)bindAdd();
  if(view==='consumo')bindConsumo();
  if(view==='resumen'&&histId!==null)bindHist();
  else if(view==='resumen'){
    $('bCsv').onclick=()=>{const t=csv();const m=$('csvMsg');
      const fb=()=>{m.innerHTML='Selecciona y copia el texto:<textarea readonly>'+esc(t)+'</textarea>';m.querySelector('textarea').select()};
      try{navigator.clipboard.writeText(t).then(()=>m.textContent='Copiado. Pégalo en Excel o en un correo.',fb)}catch(e){fb()}};
    $('bPdf').onclick=pdf;
    $('bReset').onclick=()=>{confirmReset=true;histMsg='';render()};
    if(confirmReset){const b=$('bSave');
      if(b){b.onclick=()=>{const h=snapshot();clearCount(h);confirmReset=false;histMsg=`Guardado en el historial como "${histTitle(h.t)}".`;render()};
        $('bYes').onclick=()=>{clearCount();confirmReset=false;render()}}
      $('bNo').onclick=()=>{confirmReset=false;render()}}
    bindHist();
  }
}
function setVal(id,field,raw){
  const v=String(raw).replace(',','.').trim();
  cfg().set({[field]:{[id]:(v===''||isNaN(+v)||+v<0)?FV.delete():+v}},{merge:true}).catch(writeErr);
}
function addCount(id,n,fromBtn){
  const prev=has(st.count[id])?+st.count[id]:0;
  n=Math.max(n,-prev);if(!n)return;
  const ref=cRef(id),b=fs.batch(),old=fromBtn&&btnRun[id]?myLast(id):null;
  if(old){const merged=Object.assign({},old,{n:Math.round((old.n+n)*100)/100});
    b.set(ref,{total:FV.increment(n),log:FV.arrayRemove(old)},{merge:true});
    if(merged.n)b.set(ref,{log:FV.arrayUnion(merged)},{merge:true});}
  else b.set(ref,{total:FV.increment(n),log:FV.arrayUnion(entry(n))},{merge:true});
  btnRun[id]=!!fromBtn;
  b.commit().catch(writeErr);
}
function markZero(id){cRef(id).set({total:FV.increment(0),log:FV.arrayUnion(entry(0))},{merge:true}).catch(writeErr)}
function undoCount(id){
  const e=myLast(id);if(!e)return;btnRun[id]=false;
  if((st.log[id]||[]).length<=1)cRef(id).delete().catch(writeErr);
  else cRef(id).set({total:FV.increment(-e.n),log:FV.arrayRemove(e)},{merge:true}).catch(writeErr);
}
function toast(id,n){
  const it=items().find(x=>x.id===id),t=$('toast'),name=it.n||it.sap||'producto';
  t.innerHTML=`<span>${n?(n<0?'Se restó ':'Se sumó ')+fmtN(Math.abs(n)):'Registrado en 0'}: ${esc(name)}</span><button class="lnk" id="tUndo">Deshacer</button>`;
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,6000);
  $('tUndo').onclick=()=>{undoCount(id);refreshRow(id);t.hidden=true};
}
function refreshRow(id){
  const el=document.querySelector(`.row[data-id="${id}"]`);if(!el)return;
  const it=items().find(x=>x.id===id);const tmp=document.createElement('div');tmp.innerHTML=rowHTML(it);el.replaceWith(tmp.firstElementChild);progress();
}
$('main').addEventListener('click',e=>{
  const ed=e.target.closest('button[data-ed]');
  if(ed){const id=+ed.closest('.row').dataset.id,a=ed.dataset.ed;
    if(a==='open'){const prev=editId;editId=id;if(prev!==null)refreshRow(prev);refreshRow(id);$('eName-'+id).focus();return}
    if(a==='save'){const n=tc($('eName-'+id).value.trim()),sap=$('eSap-'+id).value.trim(),err=$('eErr-'+id);
      const fail=m=>{err.textContent=m;err.hidden=false};
      if(!n&&!sap)return fail('Deja al menos el nombre o el código SAP.');
      if(sap&&!/^\d{5,7}$/.test(sap))return fail('El código SAP lleva solo números (5 a 7 dígitos).');
      const c=+$('eCat-'+id).value,moved=c!==items().find(x=>x.id===id).c;
      cfg().set({edit:{[id]:{n,sap,c}}},{merge:true}).catch(writeErr);
      if(moved){editId=null;render();const el=document.querySelector(`.row[data-id="${id}"]`);if(el)el.scrollIntoView({block:'center'});return}}
    if(a==='del'||a==='delno'){removeId=a==='del'?id:null;refreshRow(id);return}
    if(a==='delyes'){delItem(id);editId=null;removeId=null;render();return}
    editId=null;removeId=null;refreshRow(id);return}
  const r=e.target.closest('button[data-rm]');
  if(r){const id=+r.closest('.row').dataset.id,a=r.dataset.rm;
    if(a==='ask')removeId=id;else if(a==='no')removeId=null;
    else{cfg().set({extra:{[id]:FV.delete()},min:{[id]:FV.delete()},edit:{[id]:FV.delete()}},{merge:true}).catch(writeErr);cRef(id).delete().catch(writeErr);removeId=null;return}
    refreshRow(id);return}
  const o=e.target.closest('button[data-open]');
  if(o){const id=+o.closest('.row').dataset.id,prev=openId;openId=prev===id?null:id;if(prev!==null&&prev!==id)refreshRow(prev);refreshRow(id);return}
  const u=e.target.closest('button[data-undo]');
  if(u){const id=+u.closest('.row').dataset.id;undoCount(id);refreshRow(id);return}
  const b=e.target.closest('button[data-d]');if(!b)return;
  const id=+b.closest('.row').dataset.id;
  addCount(id,+b.dataset.d,true);refreshRow(id);
});
$('main').addEventListener('change',e=>{
  const inp=e.target;if(inp.tagName!=='INPUT'||!/^(count|min)-/.test(inp.id))return;
  const id=+inp.closest('.row').dataset.id;
  if(view==='contar'){
    const raw=inp.value.trim().replace(',','.'),n=parseFloat(raw);
    if(raw!==''&&!isNaN(n)){
      if(n){addCount(id,n,false);toast(id,n)}
      else if(!has(st.count[id])){markZero(id);toast(id,0)}
    }
  }
  else setVal(id,'min',inp.value);
  refreshRow(id);
});
$('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&/^(count|min)-/.test(e.target.id))e.target.blur()});
$('main').addEventListener('focusin',e=>{if(e.target.tagName==='INPUT')e.target.select()});
$('bAdd').onclick=()=>{adding=true;addMsg='';render();$('aName').focus();window.scrollTo(0,0)};
['q','fPend','fLow'].forEach(id=>$(id).addEventListener('input',render));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;confirmReset=false;histId=null;confirmDelHist=false;histMsg='';editId=null;openId=null;removeId=null;
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  render();window.scrollTo(0,0);
});
chips();render();gate();
</script>
